plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Optional integrations (Cloth Config, Mod Menu) are pulled from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"storageback" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

loom {
	mods {
		"storageback-test" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		// Server game tests: ./gradlew runGametest
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// Client smoke test with screenshots: xvfb-run ./gradlew runClientSmoke [-PsmokeLang=pl_pl]
		clientSmoke {
			client()
			name = "Client Smoke"
			vmArg "-Dstorageback.smoke=true"
			vmArg "-Dstorageback.smokeShots=" + (project.findProperty("smokeShots") ?: "/workspace/snb-backport/" + project.minecraft_version)
			vmArg "-Dstorageback.smokeLang=" + (project.findProperty("smokeLang") ?: "en_us")
			runDir "build/clientsmoke"
			source sourceSets.gametest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// OPTIONAL at runtime: the mod checks FabricLoader.isModLoaded before touching them.
	modCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	if (project.findProperty("withConfigMods") == "true") {
		modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
		modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

def javaRelease = (project.java_release as String) as int

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
